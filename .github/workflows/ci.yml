name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "markitdown[docx,pdf]" python-docx reportlab
      - name: Test hooks
        run: python -m unittest discover -s hooks -v
      - name: Test tools
        run: python -m unittest discover -s tools -v
      - name: Check plugin contents
        run: python tools/build_plugin.py --check
