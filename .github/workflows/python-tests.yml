name: Python tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "markitdown[docx,pdf]" python-docx reportlab
      - name: Test hooks
        run: python -m unittest discover -s hooks
      - name: Test tools
        run: python -m unittest discover -s tools
      - name: Verify plugin copies
        run: python tools/build_plugin.py --check
